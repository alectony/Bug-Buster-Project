<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress | Python Garden</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&amp;family=Pixelify+Sans:wght@500;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/pixel.css">
  <link rel="stylesheet" href="/css/game.css">
</head>
<body data-role="user">
  <div id="app-nav"></div>
  <main class="container page-main" id="progress-root">
    <div class="page-head"><h1>My progress</h1></div>
    <div class="stack">
      <section class="px-card rank-card" aria-labelledby="rank-name">
        <div class="row"><span class="spr spr--lg" data-sprite="trophy"></span><div><p class="muted">Current rank</p><h2 id="rank-name">...</h2></div></div>
        <div>
          <label class="px-label" for="xp-bar">Progress to next rank</label>
          <progress id="xp-bar" class="px-bar px-bar--sun" max="1" value="0"></progress>
          <p id="xp-text" class="px-help"></p>
        </div>
      </section>
      <section class="stat-grid" aria-label="Totals">
        <div class="px-card stat"><strong id="stat-done">0</strong><span class="muted">Levels done</span></div>
        <div class="px-card stat"><strong id="stat-streak">0</strong><span class="muted">Day streak</span></div>
        <div class="px-card stat"><strong id="stat-seeds">0</strong><span class="muted">Seeds</span></div>
      </section>
      <section class="px-card" aria-labelledby="mastery-h">
        <h2 id="mastery-h">Mastery by concept</h2>
        <div id="mastery" class="mastery"></div>
      </section>
      <section aria-labelledby="ms-h">
        <h2 id="ms-h">Milestones</h2>
        <ul id="milestones" class="milestones"></ul>
      </section>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/guard.js"></script>
  <script src="/js/progress.js"></script>
</body>
</html>
