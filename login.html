<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Python Garden</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&amp;family=Pixelify+Sans:wght@500;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pixel.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/reference.css">
</head>
<body data-role="guest" class="auth">
  <a class="auth-back" href="index.html">‹ Back to home</a>
  <main class="px-card auth__card">
    <aside class="auth-scene" aria-label="Sprout the turtle in the garden">
      <div class="auth-stars" aria-hidden="true">✦　·　✦</div>
      <span class="spr spr--turtle spr--xl" data-sprite="turtle"></span>
      <div class="bubble"><p>Ready to plant some new code today?</p></div>
      <div class="auth-hill" aria-hidden="true"></div>
    </aside>
    <section class="auth-form-side">
      <div class="auth__brand"><span class="spr spr--turtle" data-sprite="turtle"></span><div><p class="chapter-kicker">WELCOME BACK</p><h1>Welcome back, gardener!</h1></div></div>
      <p class="auth-intro">Your garden has been waiting for you.</p>
      <form id="auth-form" data-mode="login" novalidate>
        <div class="px-field"><label class="px-label" for="email">Email address</label><input class="px-input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
        <div class="px-field"><div class="auth-label-row"><label class="px-label" for="password">Password</label><span class="auth-forgot">Forgot password?</span></div><input class="px-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>
        <p id="form-error" class="px-error" role="alert"></p>
        <button class="px-btn px-btn--sun auth-submit" type="submit">Log in ›</button>
      </form>
      <div class="auth-divider"><span>OR CONTINUE WITH</span></div>
      <div class="auth-providers" aria-label="Available sign in options"><span class="provider-mark">G&nbsp; Google</span><span class="provider-mark">◈&nbsp; GitHub</span></div>
      <p class="auth__alt">New here? <a href="register.html">Create an account</a></p>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
